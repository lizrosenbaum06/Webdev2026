<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home | My Projects</title>
<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
}

/* TITLE */
.page-title {
  position: fixed;
  top: 40px;
  left: 40px;
  font-size: 1.5rem;
  margin: 0;
  text-transform: uppercase;
  z-index: 1000;
}

.page-title-2 {
  position: fixed;
  top: 46px;
  left: 225px;
  font-size: 1rem;
  margin: 0;
  text-transform: uppercase;
  z-index: 1000;
}

.white-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100px;
  background-color: white;
  z-index: 999;
}

.nav {
  position: fixed;
  top: 40px;
  right: 40px;
  z-index: 1000;
}

.menu-button {
  font-size: 1.2rem;
  cursor: pointer;
  text-transform: uppercase;
}

.dropdown {
  position: absolute;
  right: 0;
  margin-top: 10px;
  opacity: 0;
  transform: translateY(-10px);
  transition: 0.3s ease;
  pointer-events: none;
}

.dropdown.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.dropdown a {
  display: block;
  font-size: 1.2rem;
  color: black;
  text-decoration: none;
  margin: 10px 0;
  text-transform: uppercase;
}

.dropdown a:hover {
  color: darkred;
}

/* BACKGROUND IMAGE */
.home-image {
  position: relative;
  width: 100%;
  margin-top: 100px; /* space for the white bar */
}

.home-image img {
  width: 100%;
  height: auto;
  display: block;
}

/* HOVER BOXES */
.hover-box {
  position: absolute;
  top: 0;
  height: 100%;
  border: 2px solid rgba(0,0,0,0); /* transparent */
  cursor: pointer;
  z-index: 10;
}

/* Hover image */
.hover-box img {
  position: absolute;
  top: -1px;
  left: -1px;
  width: 100%;
  height: 100%;
  display: none;
  object-fit: cover;
  z-index: 11;
}

.hover-box:hover img {
  display: block;
}
</style>
</head>
<body>

<!-- TITLE & NAV -->
<div class="page-title">digital diary</div>
<div class="page-title-2">by liz</div>
<div class="white-bar"></div>

<div class="nav">
  <div class="menu-button" onclick="toggleMenu()">menu</div>
  <div class="dropdown" id="dropdown">
    <a href="about.html">About</a>
    <a href="2025.html">2025 Projects</a>
    <a href="2024.html">2024 Projects</a>
  </div>
</div>

<!-- BACKGROUND IMAGE WITH HOVER BOXES -->
<div class="home-image">
  <img src="homepage.JPG" alt="Home Image">

<div class="hover-box" style="left:0%; width:6.25%"><img src="background/home1.JPG"></div>
<div class="hover-box" style="left:6.25%; width:6.25%"><img src="background/home1-2.jpg"></div>
<div class="hover-box" style="left:12.5%; width:6.25%"><img src="background/home2.JPG"></div>
<div class="hover-box" style="left:18.75%; width:6.25%"><img src="background/home2-2.jpg"></div>
<div class="hover-box" style="left:25%; width:6.25%"><img src="background/home3.JPG"></div>
<div class="hover-box" style="left:31.25%; width:6.25%"><img src="background/home3-2.jpg"></div>
<div class="hover-box" style="left:37.5%; width:6.25%"><img src="background/home4.JPG"></div>
<div class="hover-box" style="left:43.75%; width:6.25%"><img src="background/home4-2.jpg"></div>
<div class="hover-box" style="left:50%; width:6.25%"><img src="background/home5.JPG"></div>
<div class="hover-box" style="left:56.25%; width:6.25%"><img src="background/home5-2.jpg"></div>
<div class="hover-box" style="left:62.5%; width:6.25%"><img src="background/home6.JPG"></div>
<div class="hover-box" style="left:68.75%; width:6.25%"><img src="background/home6-2.jpg"></div>
<div class="hover-box" style="left:75%; width:6.25%"><img src="background/home7.JPG"></div>
<div class="hover-box" style="left:81.25%; width:6.25%"><img src="background/home7-2.jpg"></div>
<div class="hover-box" style="left:87.5%; width:6.25%"><img src="background/home8.JPG"></div>
<div class="hover-box" style="left:93.75%; width:6.25%"><img src="background/home8-2.jpg"></div>
</div>

<script>
function toggleMenu() {
  document.getElementById("dropdown").classList.toggle("show");
}
window.addEventListener("click", function(e) {
  const menu = document.getElementById("dropdown");
  const button = document.querySelector(".menu-button");
  if (!button.contains(e.target) && !menu.contains(e.target)) {
    menu.classList.remove("show");
  }
});
</script>

</body>
</html>
