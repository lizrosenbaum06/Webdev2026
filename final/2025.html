<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: white;
  color: black;
}

.white-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100px;
  background: white;
  z-index: 1000;
}

.page-title {
  position: fixed;
  top: 40px;
  left: 160px;
  font-size: 1.5rem;

}

.page-title-2 {

}

.nav {
  position: fixed;
  top: 40px;
  right: 40px;
  z-index: 1100;
}

.menu-button {
  font-size: 1.2rem;
  cursor: pointer;
  text-transform: uppercase;
}

.dropdown {
  position: absolute;
  right: 0;
  margin-top: 10px;
  opacity: 0;
  transform: translateY(-10px);
  transition: 0.3s ease;
  pointer-events: none;
}

.dropdown.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.dropdown a {
  display: block;
  font-size: 1.2rem;
  color: black;
  text-decoration: none;
  margin: 10px 0;
  text-transform: uppercase;
}

.dropdown a:hover {
  color: darkred;
}

.home-image {
  position: fixed;
  top: 100px; /* sits under white bar */
  left: 0;
  width: 100%;
  z-index: 0;
}

.home-image img {
  width: 100%;
  height: auto;
  display: block;
}

.home-image-2{
  position: fixed;
  top: 150px;
  left: 0;
  width: 100%;
  z-index: 1;
}

.home-image-2 img{
  position: absolute;  
  width: 40%;
  left: 60%;
  height: auto;
}


.canvas {
   position: relative;
  width: 100%;
  min-height: 120vh;
  z-index: 1;
}

.project {
  position: absolute;
  z-index: 2;
}

.project img {
  display: block;
  width: 16vw;
  max-width: 300px;
  height: auto;
  transition: transform 0.3s ease;
}

.project img:hover {
  transform: scale(1.1);
  cursor: pointer;
}

.decor {
  position: absolute;
  z-index: 2;
}

.decor img {
  display: block;
  width: 16vw;
  max-width: 300px;
  height: auto;
}

.xxxxsmall img { width: 3vw; }

.xxsmall img { width: 9vw; }
.xsmall img { width: 12vw; }
.small img { width: 18vw; }
.medium img { width: 24vw; }
.large img { width: 28vw; }
.xlarge img { width: 50vw; }

/* MOBILE */
@media (max-width: 768px) {

  .canvas {
    position: static;
    height: auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 2rem;
    padding: 1rem;
    margin-top: 120px;
  }

  .project {
    position: static;
  }

  .project img {
    width: 100%;
    margin: 0 auto;
  }

  .nav {
    right: 20px;
    top: 20px;
  }

  .page-title {
    left: 20px;
    top: 20px;
    font-size: 1.3rem;
  }
}

<script>
function toggleMenu() {
  document.getElementById("dropdown").classList.toggle("show");
}

window.addEventListener("click", function(e) {
  const menu = document.getElementById("dropdown");
  const button = document.querySelector(".menu-button");
  if (!button.contains(e.target) && !menu.contains(e.target)) {
    menu.classList.remove("show");
  }
});
</script>
