<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About | My Projects</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Helvetica, Arial, sans-serif;
  background: white;
  color: black;
}

/* WHITE BAR */
.white-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100px;
  background-color: white;
  z-index: 999;
}

/* TITLE (matches homepage style) */
.page-title {
  position: fixed;
  top: 40px;
  left: 40px;
  font-size: 1.5rem;
  text-transform: uppercase;
  z-index: 1000;
}

/* NAV (top right) */
.nav {
  position: fixed;
  top: 40px;
  right: 40px;
  z-index: 1000;
}

.menu-button {
  font-size: 1.2rem;
  cursor: pointer;
  text-transform: uppercase;
}

.dropdown {
  position: absolute;
  right: 0;
  margin-top: 10px;
  opacity: 0;
  transform: translateY(-10px);
  transition: 0.3s ease;
  pointer-events: none;
}

.dropdown.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.dropdown a {
  display: block;
  font-size: 1.2rem;
  color: black;
  text-decoration: none;
  margin: 10px 0;
  text-transform: uppercase;
}

.dropdown a:hover {
  color: darkred;
}

/* ABOUT CONTENT */
.about-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 60px;
  max-width: 1000px;
  margin: 160px auto 0 auto; /* push below white bar */
  padding: 0 20px;
}

.about-text {
  flex: 1;
  max-width: 500px;
}

.about-text h1 {
  font-size: 2rem;
  margin-bottom: 20px;
}

.about-text p {
  font-size: 1rem;
  line-height: 1.5;
  margin-bottom: 15px;
}

.about-image {
  display: flex;
  flex-direction: row;   
  justify-content: center;
  gap: 20px;
  margin-top: 120px;    
}

.about-image img {
  width: 25vw;   /* responsive width */
  max-width: 300px;
  height: auto;
}
/* MOBILE */
@media (max-width: 768px) {
  .about-container {
    flex-direction: column;
    text-align: center;
  }

  .about-image img {
    width: 80%;
    margin-top: 20px;
  }

  .nav {
    right: 20px;
    top: 20px;
  }

  .page-title {
    top: 20px;
    left: 20px;
  }
}
</style>
</head>

<body>

<!-- WHITE BAR + TITLE -->
<div class="white-bar"></div>
<div class="page-title">about</div>

<!-- NAV MENU -->
<div class="nav">
  <div class="menu-button" onclick="toggleMenu()">menu</div>
  <div class="dropdown" id="dropdown">
    <a href="home.html">Home</a>
    <a href="2025.html">2025 Projects</a>
    <a href="2024.html">2024 Projects</a>
  </div>
</div>

<!-- ABOUT CONTENT -->
<!-- PHOTOS (now full-width row under header) -->
<div class="about-image">
  <img src="img/aboutme1.jpeg">
  <img src="img/aboutme2.png">
  <img src="img/aboutme3.png">
</div>

<!-- TEXT BELOW -->
<div class="about-container">
  <div class="about-text">
    <h1>About Me</h1>
    <p>
      I’m Liz, an artist working across photography, digital media, sound, and textiles.
    </p>
    <p>
      This site is a collection of projects organized by year (more like an archive than a portfolio).
    </p>
  </div>
</div>

<script>
function toggleMenu() {
  document.getElementById("dropdown").classList.toggle("show");
}

window.addEventListener("click", function(e) {
  const menu = document.getElementById("dropdown");
  const button = document.querySelector(".menu-button");
  if (!button.contains(e.target) && !menu.contains(e.target)) {
    menu.classList.remove("show");
  }
});
</script>

</body>
</html>
