<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2025</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: white;
}

/* HEADER */
.page-title {
  position: fixed;
  top: 70px;
  left: 40px;
  font-size: 1.5rem;
  z-index: 1000;
}

.back-link {
  position: fixed;
  top: 40px;
  left: 40px;
  color: black;
  text-decoration: none;
  font-size: 1rem;
  z-index: 1000;
}

/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 140px 40px 40px;
}

/* SQUARE ITEMS */
.item {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  cursor: pointer;
}

.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

/* HOVER */
.item::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.item:hover img {
  transform: scale(1.08);
}

.item:hover::after {
  opacity: 1;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white; /* 👈 changed from black */
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
}

/* CLOSE BUTTON LEFT */
.close {
  position: absolute;
  top: 25px;
  left: 35px; /* 👈 moved to left */
  color: black; /* 👈 visible on white */
  font-size: 2rem;
  cursor: pointer;
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<a href="../2024.html" class="back-link">← back</a>
<div class="page-title">march 2025</div>

<main class="gallery">
  <div class="item"><img src="img_2024/mexico1.JPG"></div>
  <div class="item"><img src="img_2024/mexico2.JPG"></div>
  <div class="item"><img src="img_2024/mexico3.JPG"></div>
  <div class="item"><img src="img_2024/mexico4.JPG"></div>
  <div class="item"><img src="img_2024/mexico5.JPG"></div>
  <div class="item"><img src="img_2024/mexico6.JPG"></div>
  <div class="item"><img src="img_2024/mexico7.JPG"></div>
  <div class="item"><img src="img_2024/mexico8.JPG"></div>
  <div class="item"><img src="img_2024/mexico9.JPG"></div>
  <div class="item"><img src="img_2024/mexico10.JPG"></div>
  <div class="item"><img src="img_2024/mexico11.JPG"></div>
  <div class="item"><img src="img_2024/mexico12.JPG"></div>
  <div class="item"><img src="img_2024/mexico13.JPG"></div>
  <div class="item"><img src="img_2024/mexico14.JPG"></div>
  <div class="item"><img src="img_2024/mexico15.JPG"></div>
  <div class="item"><img src="img_2024/mexico16.JPG"></div>

  <div class="item"><img src="img_2024/mexico18.JPG"></div>
  <div class="item"><img src="img_2024/mexico19.JPG"></div>
  <div class="item"><img src="img_2024/mexico20.JPG"></div>
  <div class="item"><img src="img_2024/mexico21.JPG"></div>
  <div class="item"><img src="img_2024/mexico22.JPG"></div>
  <div class="item"><img src="img_2024/mexico23.JPG"></div>
</main>

<!-- MODAL -->
<div class="modal" id="modal">
  <span class="close" id="close">&times;</span>
  <img id="modal-img">
</div>

<script>
const items = document.querySelectorAll(".item");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modal-img");
const closeBtn = document.getElementById("close");

items.forEach(item => {
  const img = item.querySelector("img");

  item.addEventListener("click", () => {
    modal.style.display = "flex";
    modalImg.src = img.src;
  });
});

closeBtn.addEventListener("click", () => {
  modal.style.display = "none";
});

modal.addEventListener("click", (e) => {
  if (e.target === modal) {
    modal.style.display = "none";
  }
});
</script>

</body>
</html>
