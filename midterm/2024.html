<style>
@font-face {
  font-family: "BeVietnam";
  src: url("2025/fonts/BeVietnamPro-Thin.ttf") format("truetype");
}


body {
  font-family: "BeVietnam", Helvetica, Arial, sans-serif;
  background: white;
  color: black;
  margin: 0; /* remove default browser margin */
  padding: 0; /* remove default padding */
  box-sizing: border-box; /* include padding/border in width */
}


.header-bar {
  background-color: #32bbfb;
  width: 100%; /* full width */
  height: 3rem; /* thickness of bar*/
  display: flex; /* use flexbox */
  align-items: center;
  justify-content: center;
  position: sticky; /* stays at top*/
  top: 0;
  z-index: 1000; /* keeps it above other elements */
}

.nav {
  display: flex;
  gap: 5rem; /* space between links*/
}

.nav a {
  text-decoration: none;
  color: white;
  font-size: 1rem;
  transition: 0.2s; /* smooth hover effect */
}

.nav a:hover {
  color: rgb(198, 198, 198);
}

.top-stripe {
  width: 100%;
  height: 0.3rem; /* thin stripe */
  background-color: #a9e5ff;
}

.page-title {
  font-size: 1.5rem;
  color: rgb(49, 178, 238);
  font-weight: normal;
  margin: 0.5rem 2rem;
}

/* desktop collage format */

.canvas {
  position: relative;
  width: 100%;  /* full width */
  height: 100vh; /* full screen height */
  top: -7rem; /* move all images up */

}

/* projects */
.project {
  position: absolute; /* manual placement */
  text-decoration: none;
}

.img-wrapper {
  display: flex; /* use flexbox */
  flex-direction: column; /* stack image + caption */
  align-items: flex-start;/* align left */
}

.project img {
  display: block; /* remove inline spacing */
  width: 16vw; /* responsive width */
  max-width: 300px; /* prevent too large */
  height: auto; /* keep proportions */
  transition: transform 0.3s ease;
}

.project img:hover {
  transform: scale(1.1) rotate(-1deg); /* enlarge + slight tilt */
  cursor: pointer;

}

/* captions */
.caption {
  font-size: 0.7rem;
  color: #1bbfe8;
  margin: 0.3rem;
  font-weight: 100;
}

/* caption positioning variations */
.caption-bottom-left { order: 2; align-self: flex-start; }
.caption-bottom-right { order: 2; align-self: flex-end; }
.caption-top-left { order: -1; align-self: flex-start; }
.caption-top-right { order: -1; align-self: flex-end; }

/* image sizes */
.small img { width: 10vw; }
.medium img { width: 14vw; }
.large img { width: 18vw; }

/* mobile version */

@media (max-width: 768px) {

  .small img { width: 40%; }
  .medium img { width: 50%; }
  .large img { width: 100%; }


  .canvas {
    position: static; /* remove absolute layout */
    height: auto; 
    display: grid; /* switch to grid layout */
    grid-template-columns: 1fr; /* single column */
    gap: 2rem;
    padding: 1rem;
  }

  .project {
    position: static; 
  }

  .project img {
    margin: 0 auto; /* center all images */
  }

  .img-wrapper {
    align-items: center;
    width: 100%;
  }

  .caption {
    text-align: center; /* center text */
    align-self: center !important; /* override left/right rules */
  }

  .nav {
    gap: 2rem;
  }

  .page-title {
    margin: 1rem;
    font-size: 1.3rem;
  }
}

</style>
</head>
