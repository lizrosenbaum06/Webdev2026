<style>
@font-face {
  font-family: "BeVietnam";
  src: url("2025/fonts/BeVietnamPro-Thin.ttf") format("truetype");
}

/* Base */
body {
  font-family: "BeVietnam", Helvetica, Arial, sans-serif;
  background: white;
  color: black;
  margin: 0;
  padding: 0;
}

/* Top colored header bar */
.header-bar {
  background-color: #8bdaff; /* main bar color */
  width: 100%;
  height: 4rem;  /* thickness of the bar */
  display: flex;
  align-items: center;
  justify-content: center; /* center the nav */
  position: sticky;
  top: 0;
  z-index: 1000;
}

/* Centered nav inside bar */
.header-bar .nav {
  display: flex;
  gap: 5rem; /* space between links */
}

.header-bar .nav a {
  text-decoration: none;
  color: black; /* nav links color */
  font-size: 1.2rem;
  transition: opacity 0.2s;
}

.header-bar .nav a:hover {
  color: rgb(198, 66, 0);
}

/* Optional stripe under bar */
.top-stripe {
  width: 100%;
  height: 0.7rem; /* stripe thickness */
  background-color: #00ccff; /* stripe color */
}

/* Page title below the bar */
.page-title {
  font-size: 2rem;
  font-weight: normal;
  text-align: left;
  margin: 0.5rem 2rem; /* spacing */
}

/* Canvas */
.canvas {
  position: relative;
  width: 100%;
  height: 100vh;
  top: -8rem;
  z-index: 1;
}

/* Projects */
.project {
  position: absolute;
  text-decoration: none;
}

.img-wrapper {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.project img {
  display: block;
  width: 16vw;
  max-width: 300px;
  height: auto;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.project img:hover {
  transform: scale(1.1) rotate(-1deg);
  cursor: pointer;
  box-shadow: 0 0 0 3px #ff6a00;
}

/* Captions */
.caption {
  font-size: 0.7rem;
  color: #ffa200;
  font-family: Helvetica, Arial, sans-serif;
  text-decoration: none !important;
  margin: 0.3rem;
  font-weight: 100;
}

.caption-bottom-left { order: 2; align-self: flex-start; }
.caption-bottom-right { order: 2; align-self: flex-end; }
.caption-top-left { order: -1; align-self: flex-start; }
.caption-top-right { order: -1; align-self: flex-end; }

/* Sizes */
.small img { width: 10vw; }
.medium img { width: 14vw; }
.large img { width: 18vw; }

</style>
</head>
