<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home | My Projects</title>
  <style>
    @font-face {
      font-family: "BeVietnam";
      src: url("2025/fonts/BeVietnamPro-Thin.ttf") format("truetype");
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "BeVietnam", Helvetica, Arial, sans-serif;
      margin: 0;
      background: white;
      color: black;
      padding: 40px;
    }

    .page-title {
      text-align: center;
      font-size: 2.5rem;
      margin: 30px 0;
    }

    .nav {
      position: fixed;
      top: 40px;
      left: 40px;
    }

    .nav a {
      display: block;
      font-size: 1.2rem;
      color: red;
      text-decoration: none;
      margin: 15px 0;
    }

    .nav a:hover {
      color: darkred;
    }

    .about-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      max-width: 1000px;
      margin: 120px auto 0 auto; 
    }

    .about-text {
      flex: 1;
      max-width: 500px;
    }

    .about-text h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .about-text p {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .about-image {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

    .about-image img {
      width: 300px;
      height: auto;
      border-radius: 4px; 
    }

    @media (max-width: 768px) {
      .about-container {
        flex-direction: column;
        text-align: center;
      }

      .about-image img {
        width: 80%;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Page Title -->
  <div class="page-title">liz rosenbaum</div>

  <!-- Left nav -->
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="2025.html">2025 Projects</a>
    <a href="2024.html">2024 Projects</a>
  </div>

  <!-- Two-column about section -->
  <div class="about-container">
    <div class="about-text">
      <h1>About Me</h1>
      <p>
        I’m Liz, an artist working across photography, digital media, sound, and textiles.
      </p>
      <p>
        This site is a collection of projects organized by year (more like an archive than a portfolio).
      </p>
    </div>

    <div class="about-image">
      <img src="aboutme1.jpeg" alt="Photo of me">
      <img src="aboutme2.png" alt="Photo of me">
      <img src="aboutme3.png" alt="Photo of me">
    </div>
  </div>

</body>
</html>
